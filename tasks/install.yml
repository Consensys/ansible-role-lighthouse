---
- name: install | Lookup lighthouse user
  ansible.builtin.getent:
    database: passwd
    key: "{{ lighthouse_user }}"
  register: lighthouse_user_entry
  failed_when: false

- name: install | Determine if lighthouse user exists
  ansible.builtin.set_fact:
    lighthouse_user_exists: "{{ lighthouse_user in (lighthouse_user_entry.ansible_facts.getent_passwd | default({})) }}"

- name: install | If lighthouse user exists - check if the UID matches the expected value
  when: lighthouse_user_exists | bool
  block:
    - name: install | Extract current UID
      ansible.builtin.set_fact:
        lighthouse_current_uid: "{{ lighthouse_user_entry.ansible_facts.getent_passwd[lighthouse_user][1] | int }}"

    - name: install | Determine if UID update is needed
      ansible.builtin.set_fact:
        lighthouse_uid_needs_update: "{{ lighthouse_current_uid != lighthouse_uid }}"

- name: install | Populate service facts
  ansible.builtin.service_facts:

# This will ignore the case when lighthouse-beacon is manually stopped - it assumes that is a mistake
# If you are manually stopping and updating lighthouse - disable the systemd service
- name: install | Debug lighthouse-beacon service state
  ansible.builtin.debug:
    var: ansible_facts.services['lighthouse-beacon.service']

- name: install | Halt the beacon service if its running while we update
  ansible.builtin.systemd:
    name: lighthouse-beacon
    state: "stopped"
  become: true
  register: lighthouse_beacon_systemd_stopped
  when: (ansible_facts.services['lighthouse-beacon.service'] is defined) and
        ((ansible_facts.services['lighthouse-beacon.service'].status == "enabled") or
         (lighthouse_uid_needs_update | default(false) | bool))

- name: install | Set updated optionally to trigger a systemd restart at the end (beacon)
  ansible.builtin.set_fact:
    lighthouse_state_updates_beacon: "{{ lighthouse_state_updates_beacon + ['lighthouse.running_service'] }}"
  when: (lighthouse_beacon_systemd_stopped is defined) and
        (lighthouse_beacon_systemd_stopped.state | default('') == "stopped")

# This will ignore the case when lighthouse-validator is manually stopped - it assumes that is a mistake
# If you are manually stopping and updating lighthouse - disable the systemd service
- name: install | Debug lighthouse-validator service state
  ansible.builtin.debug:
    var: ansible_facts.services['lighthouse-validator.service']

- name: install | Halt the validator service if its running while we update
  ansible.builtin.systemd:
    name: lighthouse-validator
    state: "stopped"
  become: true
  register: lighthouse_validator_systemd_stopped
  when: (ansible_facts.services['lighthouse-validator.service'] is defined) and
        ((ansible_facts.services['lighthouse-validator.service'].status == "enabled") or
         (lighthouse_uid_needs_update | default(false) | bool))

- name: install | Set updated optionally to trigger a systemd restart at the end (validator)
  ansible.builtin.set_fact:
    lighthouse_state_updates_validator: "{{ lighthouse_state_updates_validator + ['lighthouse.running_service'] }}"
  when: (lighthouse_validator_systemd_stopped is defined) and
        (lighthouse_validator_systemd_stopped.state | default('') == "stopped")

- name: install | Ensure lighthouse group exists
  ansible.builtin.group:
    name: "{{ lighthouse_group }}"
    gid: "{{ lighthouse_gid }}"
    state: present
  become: true
  register: lighthouse_group_details

- name: install | Create lighthouse user
  ansible.builtin.user:
    comment: lighthouse client user
    name: "{{ lighthouse_user }}"
    uid: "{{ lighthouse_uid }}"
    group: "{{ lighthouse_group }}"
  become: true
  register: lighthouse_user_details

- name: install | Create directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ lighthouse_user }}"
    group: "{{ lighthouse_group }}"
    recurse: true
  loop:
    - "{{ lighthouse_base_dir }}"
    - "{{ lighthouse_install_dir }}"
    - "{{ lighthouse_config_dir }}"
    - "{{ lighthouse_keys_dir }}"
    - "{{ lighthouse_wallet_dir }}"
    - "{{ lighthouse_secrets_dir }}"
    - "{{ lighthouse_data_dir }}"
    - "{{ lighthouse_validator_data_dir }}"
    - "{{ lighthouse_log_dir }}"
  become: true

- name: install | Ownership init marker
  ansible.builtin.stat:
    path: "{{ lighthouse_data_dir }}/.ownership_initialized"
  register: ownership_marker

- name: install | One-time recursive ownership of data dir
  when: not ownership_marker.stat.exists
  block:
    - name: install | Set recursive ownership of data dir
      ansible.builtin.file:
        path: "{{ lighthouse_data_dir }}"
        state: directory
        owner: "{{ lighthouse_user }}"
        group: "{{ lighthouse_group }}"
        recurse: true
      become: true

    - name: install | Record that ownership was initialized
      ansible.builtin.copy:
        dest: "{{ lighthouse_data_dir }}/.ownership_initialized"
        content: "initialized: {{ ansible_date_time.iso8601 }}"
        owner: "{{ lighthouse_user }}"
        group: "{{ lighthouse_group }}"
        mode: "0644"
      become: true

- name: install | Extract lighthouse source to install directory [version {{ _lighthouse_version }}]
  ansible.builtin.unarchive:
    src: "{{ lighthouse_download_url }}"
    remote_src: true
    dest: "{{ lighthouse_install_dir }}"
    owner: "{{ lighthouse_user }}"
    group: "{{ lighthouse_group }}"
    mode: '0777'
  become: true
  register: extract_src

- name: install | Create a symlink to current
  ansible.builtin.file:
    src: "{{ lighthouse_install_dir }}/"
    dest: "{{ lighthouse_current_dir }}"
    state: link
  register: create_symlink
  become: true

- name: install | Set updated optionally to trigger a systemd restart at the end
  ansible.builtin.set_fact:
    lighthouse_state_updates: "{{ lighthouse_state_updates + ['lighthouse.install_dir'] }}"
    lighthouse_state_updates_validator: "{{ lighthouse_state_updates_validator + ['lighthouse.install_dir'] }}"
    lighthouse_state_updates_beacon: "{{ lighthouse_state_updates_beacon + ['lighthouse.install_dir'] }}"
  when: "extract_src is changed or create_symlink is changed"
